name: Build VCam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    # macOS 跑单在这个账号上长期排队/15 分钟被取消，改用 Ubuntu + theos Linux 工具链
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl git make xz-utils libtinfo6 fakeroot dpkg perl
        sudo curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
        sudo chmod +x /usr/local/bin/ldid
        ldid -h >/dev/null && echo "ldid ok"
      timeout-minutes: 10

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 15

    - name: Install toolchain + SDK
      run: |
        export THEOS=$HOME/theos
        mkdir -p $THEOS/toolchain $THEOS/sdks
        curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
          | tar -xJ -C $THEOS/toolchain/
        ls $THEOS/toolchain/linux/iphone/bin/clang
        curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
        tar -xzf /tmp/sdks.tar.gz -C /tmp
        cp -r /tmp/sdks-master/iPhoneOS*.sdk $THEOS/sdks/ || true
        ls $THEOS/sdks/
      timeout-minutes: 20

    - name: Inspect toolchain
      run: |
        export THEOS=$HOME/theos
        ls -l $THEOS/toolchain/linux/iphone/bin | head -40
        $THEOS/toolchain/linux/iphone/bin/clang --version || true
        ls $THEOS/toolchain/linux/iphone/bin | grep -i -E "lld|ld64" || echo "no lld in bin"

    - name: Build
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make 2>&1
      timeout-minutes: 30

    - name: Fix arm64e ABI subtype
      run: |
        python3 - <<'PY'
        import glob, struct
        # 新 clang 给 arm64e 生成 ptrauth 指令（ABI v2），旧 cctools 却把 cpusubtype 写成 2（ABI v1），
        # iOS 18 的 dyld/objc 按头部信息处理这套代码 -> map_images 里 readClass trap。
        fixed = 0
        for p in glob.glob(".theos/obj/**/*.dylib", recursive=True):
            d = bytearray(open(p, "rb").read())
            if len(d) < 32:
                continue
            magic = struct.unpack(">I", d[:4])[0]
            if magic == 0xcafebabe:                      # fat
                n = struct.unpack(">I", d[4:8])[0]
                for i in range(n):
                    base = 8 + i * 20
                    sub = struct.unpack(">I", d[base + 4:base + 8])[0]
                    if sub == 2:
                        d[base + 4:base + 8] = struct.pack(">I", 0x80000002)
                        fixed += 1
            elif struct.unpack("<I", d[:4])[0] == 0xfeedfacf:   # thin
                if struct.unpack("<I", d[8:12])[0] == 2:
                    d[8:12] = struct.pack("<I", 0x80000002)
                    fixed += 1
            else:
                continue
            open(p, "wb").write(d)
            print("patched", p)
        print("total patched entries:", fixed)
        PY

    - name: Package
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1 2>&1
        echo "Build complete. Packages:"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
      timeout-minutes: 15

    - name: Patch deb ABI (arm64e -> ABI v2)
      run: python3 tools/fix_abi.py packages/*.deb

    - name: Extract dylib
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb 2>/dev/null || dpkg-deb -x "$DEB" .
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        tar -xf data.tar* 2>/dev/null && find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30
