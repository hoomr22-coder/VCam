name: Build VCam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    # macOS 跑单在这个账号上长期排队/15 分钟被取消，改用 Ubuntu + theos Linux 工具链
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl git make xz-utils libtinfo6 fakeroot dpkg perl
        sudo curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
        sudo chmod +x /usr/local/bin/ldid
        ldid -h >/dev/null && echo "ldid ok"
      timeout-minutes: 10

    - name: Install Theos
      run: |
        export THEOS=$HOME/theos
        git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 15

    - name: Install toolchain + SDK
      run: |
        export THEOS=$HOME/theos
        mkdir -p $THEOS/toolchain $THEOS/sdks
        curl -sL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
          | tar -xJ -C $THEOS/toolchain/
        ls $THEOS/toolchain/linux/iphone/bin/clang
        curl -fsSL https://github.com/theos/sdks/archive/master.tar.gz -o /tmp/sdks.tar.gz
        tar -xzf /tmp/sdks.tar.gz -C /tmp
        cp -r /tmp/sdks-master/iPhoneOS*.sdk $THEOS/sdks/ || true
        ls $THEOS/sdks/
      timeout-minutes: 20

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1 2>&1
        echo "Build complete. Packages:"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
      timeout-minutes: 35

    - name: Extract dylib
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb 2>/dev/null || dpkg-deb -x "$DEB" .
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        tar -xf data.tar* 2>/dev/null && find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30
